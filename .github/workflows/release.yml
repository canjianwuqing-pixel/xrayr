name: Build Kuaiyun XrayR Linux AMD64

on:
  workflow_dispatch:
  push:
    branches: [feature/xray-core-26.7.28]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up fixed Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: false
      - name: Test and verify fixed dependencies
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go test -count=1 -timeout=10m ./...
          go vet ./...
          go mod verify
          bash -n install.sh
          bash -n XrayR.sh
      - name: Build the original installer ZIP layout
        run: python3 release/build.py --output out/release
      - name: Upload test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XrayR-linux-64
          if-no-files-found: error
          path: |
            out/release/XrayR-linux-64.zip
            out/release/XrayR-linux-64.zip.sha256
            out/release/BUILD-INFO.json
            out/release/binary-build-info.txt

  prerelease-assets:
    # Never creates a release or promotes it to stable. Upload only to an
    # existing prerelease explicitly published by a maintainer.
    if: github.event_name == 'release' && github.event.release.prerelease == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XrayR-linux-64
          path: dist
      - name: Verify and upload to the approved prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum -c XrayR-linux-64.zip.sha256
          gh release upload "$RELEASE_TAG" XrayR-linux-64.zip XrayR-linux-64.zip.sha256 BUILD-INFO.json
